name: Wochenaufgaben Mediamatiker

on:
  schedule:
    # GitHub Actions cron kennt keine Zeitzonen (nur UTC).
    # 05:30 UTC = 07:30 Europe/Zurich waehrend Sommerzeit (CEST, Ende Maerz - Ende Okt).
    # Waehrend Winterzeit (CET, Ende Okt - Ende Maerz) laeuft es dann um 06:30 Ortszeit
    # (1h frueher). Fuer exakte 07:30 ganzjaehrig: cron zweimal pflegen und die jeweils
    # falsche Zeile 2x/Jahr per Kommentar deaktivieren, oder GitHub Actions Marketplace
    # Action "tz-cron" nutzen. Fuer den Testbetrieb reicht die 1h-Drift im Winter.
    - cron: "30 5 * * 1"
  workflow_dispatch: {}   # manueller Trigger zum Testen ueber den Actions-Tab

jobs:
  create-weekly-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installieren
        run: pip install -r requirements.txt

      - name: Wochentasks generieren und auf monday.com schreiben
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: python generate_weekly_tasks.py
